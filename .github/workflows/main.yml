name: Daily Scraping

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Removing previous chrome instances on runner
        run: sudo apt purge -y google-chrome-stable || true

      - name: Install dependencies
        run: |
          pip install numpy==1.23.5
          pip install pandas==1.5.3
          pip install -r requirements.txt
          pip install selenium chromedriver-autoinstaller pyvirtualdisplay

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Start xvfb and run scraping script
        env:
          NST_API_KEY: ${{ secrets.NST_API_KEY }}
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          python code/get_todays_games.py

      - name: Commit and push updated CSV file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/result.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update hockey stats"
            git push
          else
            echo "No changes to commit."
          fi
